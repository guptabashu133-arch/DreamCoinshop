name: Dreamcoinshop
version: '2.0.0'
main: org.mydreamduels.dreamcoinshop.Dreamcoinshop
api-version: '1.20'
folia-supported: true
author: BasuGamer56
website: https://dreamscube.fun
description: Cosmetics coin shop with dialog and chest GUI menus, country flags, perks, sellwands, Orbs and cross-server database sync
softdepend: [PlaceholderAPI, floodgate, Geyser-Spigot, ViaVersion]

commands:
  coinshop:
    description: Opens the Coinshop. /coinshop settings, sale, reload, gui, dialog for admins.
    usage: /coinshop [settings|sale|reload|gui|dialog]
    aliases: [cs]
  coin:
    description: Coins balance, and admin commands to change it.
    usage: /coin <balance|pay|give|giveall|remove|set|help>
  orb:
    description: Orbs balance, and admin commands to change it.
    usage: /orb <balance|pay|give|giveall|remove|set|help>
  orbshop:
    description: Opens the Orbshop.
    usage: /orbshop

permissions:
  dreamcoinshop.use:
    description: Open /coinshop and /orbshop and buy things.
    default: true
  dreamcoinshop.pay:
    description: Send Coins / Orbs to other players with /coin pay (when pay is enabled in config.yml).
    default: true
  dreamcoinshop.admin:
    description: Give, remove and set Coins/Orbs, /coinshop reload and sale, and the Settings menu.
    default: op
    children:
      dreamcoinshop.settings: true
  dreamcoinshop.settings:
    description: Change the plugin settings and prices from /coinshop -> Settings.
    default: op
  # Perk permissions: point these at whatever plugin provides the actual command
  # (e.g. EssentialsX) with the `permission:` field of each perk in config.yml.
  dreamcoinshop.perk.craft:
    default: false
  dreamcoinshop.perk.smithingtable:
    default: false
  dreamcoinshop.perk.grindstone:
    default: false
  dreamcoinshop.perk.anvil:
    default: false
  dreamcoinshop.perk.enderchest:
    default: false
  dreamcoinshop.perk.nick:
    default: false
