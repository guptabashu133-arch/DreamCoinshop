# ISO 3166-1 alpha-2 country code -> Bedrock font glyph codepoint.
#
# Java clients get the real flag as an inline player-head object component
# (see CountryFlagTextureRegistry). Geyser cannot translate that component,
# so Bedrock clients get ONE character from this file instead, and the
# actual picture comes from a Bedrock resource pack that overrides the
# glyph page for U+E100-U+E1FF (font/glyph_E1.png).
#
# Layout of glyph_E1.png: 256x256 px (or 512x512 for crisper flags), a
# 16x16 grid of cells. Cell index = codepoint - 0xE100, counted left to
# right, top to bottom. So E100 is the top-left cell, E10F the top-right,
# E110 the start of row 2, and so on.
#
# Order below is alphabetical by country code, which is also the order the
# cells are laid out in - see BEDROCK-FLAGS-README.md.

