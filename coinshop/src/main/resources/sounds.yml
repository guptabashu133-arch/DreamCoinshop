#
#    DreamCoinshop 2.0  ·  sounds.yml
#
#    The sound played for each action.
#      sound   a sound name, e.g. ENTITY_PLAYER_LEVELUP ("" or NONE = no sound)
#      volume  0.0 - 1.0+ (1.0 is normal)
#      pitch   0.5 - 2.0 (1.0 is normal)
#
#    There are no sounds for plain menu clicks on purpose: Minecraft already clicks
#    for every dialog button, and a second sound feels like a double click.
#
# ════════════════════════════════════════════════════════════════════════════════

# Turn every sound of this plugin on or off (also in /coinshop settings).
enabled: true

sounds:
  # Buying something
  purchase-success:  { sound: "ENTITY_PLAYER_LEVELUP",        volume: 0.7, pitch: 1.4 }
  purchase-fail:     { sound: "ENTITY_VILLAGER_NO",           volume: 1.0, pitch: 1.0 }

  # Clicking something you own to turn it on/off
  equip:             { sound: "ITEM_ARMOR_EQUIP_GENERIC",     volume: 1.0, pitch: 1.2 }
  unequip:           { sound: "BLOCK_LEVER_CLICK",            volume: 1.0, pitch: 0.8 }

  # Sellwand
  sellwand-sell:     { sound: "ENTITY_EXPERIENCE_ORB_PICKUP", volume: 1.0, pitch: 1.0 }
  sellwand-empty:    { sound: "ENTITY_VILLAGER_NO",           volume: 1.0, pitch: 1.0 }
  sellwand-break:    { sound: "ENTITY_ITEM_BREAK",            volume: 1.0, pitch: 1.0 }

  # Buy Coins - clicking "Visit Store"
  buycoins-select:   { sound: "ENTITY_EXPERIENCE_ORB_PICKUP", volume: 1.0, pitch: 1.2 }

  # A sale started (/coinshop sale)
  sale-started:      { sound: "ENTITY_PLAYER_LEVELUP",        volume: 0.6, pitch: 0.8 }

  # Getting money from /coin pay
  pay-received:      { sound: "ENTITY_EXPERIENCE_ORB_PICKUP", volume: 0.8, pitch: 1.2 }

  # The automatic Orbs payout
  orb-received:      { sound: "ENTITY_EXPERIENCE_ORB_PICKUP", volume: 0.6, pitch: 1.6 }

  # Settings menu: a setting was saved
  settings-saved:    { sound: "BLOCK_NOTE_BLOCK_PLING",       volume: 0.8, pitch: 1.6 }

  # Chest menu only (dialogs already click by themselves)
  gui-click:         { sound: "UI_BUTTON_CLICK",              volume: 0.4, pitch: 1.0 }
