# ════════════════════════════════════════════════════════════
#   Dreamcoinshop  ·  config.yml
#   Most of this can also be changed in-game: /coinshop settings
#   After editing this file, run /coinshop reload.
# ════════════════════════════════════════════════════════════

# Manage your license at https://dreamscube.fun
# Filled in automatically on first start if you downloaded Dreamcoinshop from
# BuiltByBit. Paste your key here if it's empty.
license-key: ""

# Used by the plugin to update this file. Don't change it.
config-version: 2

# ─────────────────────────────── menus ───────────────────────────────
menu:
  # Which menu /coinshop opens:
  #   AUTO   - dialog screens for Java players on Paper 1.21.6+, the chest menu for
  #            everyone else (Spigot, older servers, older clients through ViaVersion)
  #   DIALOG - dialogs whenever the server and client support them
  #   GUI    - always the chest menu
  # /coinshop gui and /coinshop dialog open one or the other directly.
  style: AUTO
  # Menus for Bedrock (Geyser) players: GUI (recommended, works best) or DIALOG.
  bedrock-style: GUI
  # A second click within this time is ignored, so a double click can't buy twice.
  click-cooldown-ms: 400
  # Show "Your balance: ..." at the top of the main menu.
  show-balance: true
  # Titles at the top of every screen.
  titles:
    main: "<gold><bold>Coinshop"
    chatcolors: "<gold><bold>Chat Colour"
    glows: "<gold><bold>Glow"
    perks: "<gold><bold>Perks"
    tags: "<gold><bold>Tags"
    gradients: "<gold><bold>Name Gradient"
    flags: "<gold><bold>Flags"
    sellwands: "<gold><bold>Sellwands"
    spawnerwands: "<gold><bold>Spawner Sellwands"
    buycoins: "<gold><bold>Buy Coins"
    topcoins: "<gold><bold>Top Coins"
    orbshop: "<light_purple><bold>Orbshop"
    orbstop: "<light_purple><bold>Orbs Top"
    settings: "<red><bold>Coinshop Settings"
  # Descriptions of the buttons on the main menu.
  descriptions:
    chatcolors: "Unlock colours & gradients for your chat messages"
    glows: "Unlock a glowing name colour"
    perks: "Unlock handy commands"
    tags: "Unlock a tag shown next to your name in chat"
    gradients: "Unlock a gradient colour for your name"
    flags: "Show your country's flag next to your name in chat"
    sellwands: "Buy wands that instantly sell a chest's contents"
    spawnerwands: "Buy wands that instantly sell spawners at a bonus rate"
    buycoins: "Top up your Coins balance with real money"
    topcoins: "See who has the most Coins on the server"
    orbshop: "Spend your Orbs on spawners"
    settings: "Change the shop settings and prices (admins)"

# Turn whole sections of the shop on or off. A section that's off is hidden
# from the menu, and anything already bought in it stops showing.
categories:
  chatcolors: true
  glows: true
  perks: true
  tags: true
  gradients: true
  flags: true
  sellwands: true
  spawnerwands: true
  buycoins: true
  topcoins: true
  orbshop: true

# ─────────────────────────────── buying ───────────────────────────────
shop:
  # Equip a colour / glow / tag / gradient / flag right after buying it.
  # false = buy first, then click it again to equip.
  equip-on-purchase: true
  # Write every purchase to the console log.
  log-purchases: true

# ─────────────────────────────── chat ───────────────────────────────
chat:
  # Format chat with the player's name gradient, tag, flag and chat colour.
  # Turn this off if another chat plugin formats chat; it can still show them
  # with %dreamcoinshop_tag%, %dreamcoinshop_flag% and %dreamcoinshop_gradient_name%.
  enabled: true
  # <name>    the player's name (with their gradient)
  # <tag>     their tag, with a space in front (empty if none)
  # <flag>    their flag, with a space in front (empty if none)
  # <message> the message (in their chat colour)
  format: "<name><tag><flag><gray>: </gray><message>"
  show-tags: true
  show-flags: true
  # Colour messages with the player's chat colour.
  chat-colors: true
  # Event priority of the chat formatting. MONITOR runs last, so it wins over
  # other plugins that also change the chat format.
  priority: MONITOR

# Name gradients are shown in chat (above) and in these places:
names:
  # The tab list name.
  tab-list: true
  # The "display name" other plugins use (e.g. join messages, /msg).
  display-name: true

# ─────────────────────────────── flags ───────────────────────────────
# Country flags, shown next to the player's tag in chat.
# Java 1.21.9+ players see the real flag picture; older clients and plain Spigot
# show the country code instead, e.g. [IN].
flags:
  # Price of each flag, in Coins.
  price: 1000
  # Which flags are for sale: ALL, or a list of country codes like [IN, US, GB].
  sold: ALL
  # Shown first in the list (the rest follow A-Z).
  featured: [IN, US, GB, PK, BD, NP, AE, CA, AU, DE, FR, BR]
  # The flag on the main menu's "Flags" button keeps changing to a different country.
  rotate:
    enabled: true
    seconds: 2
    # Stop changing it after this long without a click (0 = only change when the menu opens).
    max-seconds: 60
  # How the flag looks for players who can't see the picture (and on Spigot).
  text-format: "<gray>[<white><code></white>]</gray>"
  # Bedrock (Geyser) players:
  #   TEXT  - the country code, e.g. [IN]
  #   GLYPH - a flag picture from a resource pack (see country-flags-bedrock.properties;
  #           the TaraashMC-Flags.mcpack from Dreamtab works)
  #   HIDE  - nothing
  bedrock: TEXT
  # Flags shown per page in the list.
  per-page: 24

# ─────────────────────────────── store ───────────────────────────────
# Link of the "Visit Store" button in the Buy Coins menu.
store-url: "https://store.taraashmc.fun"

# Console command run when a Spawner Sellwand is bought. %player% = buyer's name,
# %multiplier% = the tier's multiplier written like "1.5x".
spawnerwand-give-command: "ds givewand %player% %multiplier%"

# ─────────────────────────────── orbs ───────────────────────────────
# A second currency every online player earns over time.
orbs:
  payout:
    enabled: true
    interval-minutes: 5
    amount: 1
    # Tell the player in chat (messages.yml -> orbs.received).
    message: true

# ─────────────────────────────── leaderboards ───────────────────────────────
top:
  # Players shown in Top Coins / Orbs Top.
  size: 10
  # How often the list is reloaded from the database.
  refresh-seconds: 30

# ─────────────────────────────── storage ───────────────────────────────
# Where balances and unlocks are saved.
#   SQLITE      - a file in this folder (data.db). For one server. Nothing to set up.
#   MYSQL / MARIADB / POSTGRESQL / REDIS
#               - a database server. Every server that uses the same database and
#                 table-prefix shares the same Coins, Orbs and unlocks (BungeeCord /
#                 Velocity networks), and changes show up on the others right away.
# The old coins.yml / orbs.yml / playerdata files are imported automatically once.
storage:
  type: SQLITE
  host: "localhost"
  port: 3306                # MySQL/MariaDB 3306, PostgreSQL 5432, Redis 6379
  database: "minecraft"     # MySQL / MariaDB / PostgreSQL
  username: "root"          # MySQL / MariaDB / PostgreSQL
  password: ""
  ssl: false
  table-prefix: "dcs_"      # letters, digits and _ only (Redis: also :)
  redis-username: ""        # Redis 6+ ACL user; leave empty for password only
  redis-database: 0         # Redis database number (0-15)
  # Name of this server in the logs.
  server-name: "survival"
  # SQL: how often to check for changes made on the other servers (milliseconds).
  sync-poll-ms: 1000

# ════════════════════════════════════════════════════════════
#   Shop items. Keys are ids (saved for each player who buys them) - don't
#   rename them once players own them. price is in Coins.
#   icon: optional item shown in the menus (any material name).
# ════════════════════════════════════════════════════════════

# ---------------- Chat Colours ----------------
# color: hex colour, or gradient: [from, to] for a gradient message
chatcolors:
  red:          { display: "Red",           color: "#FF5555", price: 1000, icon: RED_DYE }
  gold:         { display: "Gold",          color: "#FFAA00", price: 1000, icon: ORANGE_DYE }
  yellow:       { display: "Yellow",        color: "#FFFF55", price: 1000, icon: YELLOW_DYE }
  green:        { display: "Green",         color: "#55FF55", price: 1000, icon: LIME_DYE }
  aqua:         { display: "Aqua",          color: "#55FFFF", price: 1000, icon: LIGHT_BLUE_DYE }
  blue:         { display: "Blue",          color: "#5555FF", price: 1000, icon: BLUE_DYE }
  light_purple: { display: "Pink",          color: "#FF55FF", price: 1000, icon: MAGENTA_DYE }
  white:        { display: "White",         color: "#FFFFFF", price: 1000, icon: WHITE_DYE }
  dark_red:     { display: "Dark Red",      color: "#AA0000", price: 1000, icon: RED_DYE }
  dark_green:   { display: "Dark Green",    color: "#00AA00", price: 1000, icon: GREEN_DYE }
  dark_aqua:    { display: "Dark Aqua",     color: "#00AAAA", price: 1000, icon: CYAN_DYE }
  dark_purple:  { display: "Dark Purple",   color: "#AA00AA", price: 1000, icon: PURPLE_DYE }
  sunset_gradient: { display: "Sunset Gradient", gradient: ["#FF512F", "#F09819"], price: 1200, icon: ORANGE_DYE }
  ocean_gradient:  { display: "Ocean Gradient",  gradient: ["#2193b0", "#6dd5ed"], price: 1200, icon: LIGHT_BLUE_DYE }
  toxic_gradient:  { display: "Toxic Gradient",  gradient: ["#a8ff78", "#78ffd6"], price: 1200, icon: LIME_DYE }

# ---------------- Name Glow ----------------
# Glow colours need scoreboard teams, which Folia doesn't have: there it glows white.
glows:
  red:          { display: "Red Glow",     color: "#FF5555", price: 1000, icon: RED_DYE }
  gold:         { display: "Gold Glow",    color: "#FFAA00", price: 1000, icon: ORANGE_DYE }
  green:        { display: "Green Glow",   color: "#55FF55", price: 1000, icon: LIME_DYE }
  aqua:         { display: "Aqua Glow",    color: "#55FFFF", price: 1000, icon: LIGHT_BLUE_DYE }
  blue:         { display: "Blue Glow",    color: "#5555FF", price: 1000, icon: BLUE_DYE }
  purple:       { display: "Purple Glow",  color: "#AA00AA", price: 1000, icon: PURPLE_DYE }
  white:        { display: "White Glow",   color: "#FFFFFF", price: 1000, icon: WHITE_DYE }
  rainbow:      { display: "Rainbow Glow", rainbow: true,    price: 1500, icon: FIREWORK_STAR }

# ---------------- Perks ----------------
# permission: the permission given while the player owns the perk. This plugin only gives the
# permission - point it at whatever plugin provides the command (e.g. EssentialsX uses
# "essentials.craft", "essentials.enderchest", ...).
perks:
  craft:         { display: "/craft",         permission: "dreamcoinshop.perk.craft",         price: 100, icon: CRAFTING_TABLE }
  smithingtable: { display: "/smithingtable", permission: "dreamcoinshop.perk.smithingtable", price: 100, icon: SMITHING_TABLE }
  grindstone:    { display: "/grindstone",    permission: "dreamcoinshop.perk.grindstone",    price: 100, icon: GRINDSTONE }
  anvil:         { display: "/anvil",         permission: "dreamcoinshop.perk.anvil",         price: 100, icon: ANVIL }
  enderchest:    { display: "/enderchest",    permission: "dreamcoinshop.perk.enderchest",    price: 100, icon: ENDER_EYE }
  nick:          { display: "/nick",          permission: "dreamcoinshop.perk.nick",          price: 100, icon: NAME_TAG }

# ---------------- Tags ----------------
# text: how the tag looks (MiniMessage). Shown after the name in chat.
tags:
  phoenix: { display: "[PHOENIX]", text: "<bold><gradient:#ff6a00:#ee0979>PHOENIX</gradient></bold>", price: 1000, icon: BLAZE_POWDER }
  vip:     { display: "[VIP]",     text: "<bold><gradient:#ffd700:#ff8c00>VIP</gradient></bold>",     price: 1000, icon: DIAMOND }
  queen:   { display: "[QUEEN]",   text: "<bold><gradient:#ff1493:#ff69b4>QUEEN</gradient></bold>",   price: 1000, icon: PINK_DYE }
  pro:     { display: "[PRO]",     text: "<bold><gradient:#00c6ff:#0072ff>PRO</gradient></bold>",     price: 1000, icon: EMERALD }
  legend:  { display: "[LEGEND]",  text: "<bold><gradient:#f7971e:#ff5f6d>LEGEND</gradient></bold>",  price: 1000, icon: GOLDEN_APPLE }
  god:     { display: "[GOD]",     text: "<bold><gradient:#ffd700:#ff9d00>GOD</gradient></bold>",     price: 1000, icon: NETHER_STAR }
  king:    { display: "[KING]",    text: "<bold><gradient:#ffd700:#ff4500>KING</gradient></bold>",    price: 1000, icon: GOLD_BLOCK }
  angel:   { display: "[ANGEL]",   text: "<bold><gradient:#ffb6c1:#ffd9e6>ANGEL</gradient></bold>",   price: 1000, icon: PINK_TULIP }
  boss:    { display: "[BOSS]",    text: "<bold><gradient:#ff0000:#8b0000>BOSS</gradient></bold>",    price: 1000, icon: REDSTONE_BLOCK }
  dream:   { display: "[DREAM]",   text: "<bold><gradient:#667eea:#764ba2>DREAM</gradient></bold>",   price: 1000, icon: AMETHYST_SHARD }

# ---------------- Name Gradients ----------------
# Shown on the player's name in chat and the tab list.
namegradients:
  sunset: { display: "Sunset", from: "#FF512F", to: "#F09819", price: 1000, icon: ORANGE_DYE }
  ocean:  { display: "Ocean",  from: "#2193b0", to: "#6dd5ed", price: 1000, icon: LIGHT_BLUE_DYE }
  fire:   { display: "Fire",   from: "#f12711", to: "#f5af19", price: 1000, icon: BLAZE_POWDER }
  toxic:  { display: "Toxic",  from: "#a8ff78", to: "#78ffd6", price: 1000, icon: LIME_DYE }
  galaxy: { display: "Galaxy", from: "#360033", to: "#0b8793", price: 1000, icon: PURPLE_DYE }
  candy:  { display: "Candy",  from: "#ff9a9e", to: "#fecfef", price: 1000, icon: PINK_DYE }
  gold:   { display: "Gold",   from: "#BF953F", to: "#FCF6BA", price: 1000, icon: GOLD_NUGGET }
