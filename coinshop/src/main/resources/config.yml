# ---------------- Sellwands ----------------
# Right click a chest to sell it. multiplier is applied to sell-prices below.
sellwands:
  tier1: { display: "Sellwand I",   multiplier: 1.5, uses: 500,  price: 825 }
  tier2: { display: "Sellwand II",  multiplier: 2.0, uses: 750,  price: 1600 }
  tier3: { display: "Sellwand III", multiplier: 2.5, uses: 1000, price: 2600 }

# Base sell price per item, used by Sellwands.
sell-prices:
  COBBLESTONE: 1
  STONE: 1
  COAL: 3
  IRON_INGOT: 8
  GOLD_INGOT: 12
  DIAMOND: 40
  EMERALD: 35
  NETHERITE_SCRAP: 90
  ROTTEN_FLESH: 0.5
  BONE: 1
  STRING: 1
  GUNPOWDER: 2
  REDSTONE: 1
  LAPIS_LAZULI: 2
  RAW_IRON: 6
  RAW_GOLD: 10
  RAW_COPPER: 2
  COPPER_INGOT: 3

# ---------------- Spawner Sellwands ----------------
# Bought here, given by spawnerwand-give-command (your spawner plugin). uses is only shown.
spawnerwands:
  tier1: { display: "Spawner Sellwand I",   multiplier: 1.5,  uses: 500,  price: 1200 }
  tier2: { display: "Spawner Sellwand II",  multiplier: 1.75, uses: 750,  price: 2000 }
  tier3: { display: "Spawner Sellwand III", multiplier: 2.0,  uses: 1000, price: 3000 }

# ---------------- Buy Coins (real money) ----------------
# Only shown as information; the "Visit Store" button links to store-url. Your store
# credits the coins, e.g. with "/coin give <player> <amount>".
buycoins:
  tier1: { price-label: "₹100", coins: 500 }
  tier2: { price-label: "₹200", coins: 1100 }
  tier3: { price-label: "₹300", coins: 1800 }
  tier4: { price-label: "₹400", coins: 2600 }
  tier5: { price-label: "₹500", coins: 3500 }

# ---------------- Orbshop (spend Orbs) ----------------
# commands run from the console on purchase, %player% = buyer's name.
orbshop:
  allay:
    display: "Allay Spawner"
    price: 150
    icon: SPAWNER
    commands:
      - "ds give %player% ALLAY"
  enderman:
    display: "Enderman Spawner"
    price: 300
