  fire:   { display: "Fire",   from: "#f12711", to: "#f5af19", price: 1000 }
  toxic:  { display: "Toxic",  from: "#a8ff78", to: "#78ffd6", price: 1000 }
  galaxy: { display: "Galaxy", from: "#360033", to: "#0b8793", price: 1000 }
  candy:  { display: "Candy",  from: "#ff9a9e", to: "#fecfef", price: 1000 }
  gold:   { display: "Gold",   from: "#BF953F", to: "#FCF6BA", price: 1000 }
  ice:    { display: "Ice",    from: "#83a4d4", to: "#b6fbff", price: 1000 }

# ---------------- Sellwands ----------------
# multiplier is applied on top of the base sell price defined below in sell-prices
sellwands:
  tier1: { display: "Sellwand I",   multiplier: 1.5, uses: 500,  price: 825 }
  tier2: { display: "Sellwand II",  multiplier: 2.0, uses: 750,  price: 1600 }
  tier3: { display: "Sellwand III", multiplier: 2.5, uses: 1000, price: 2600 }

# Base sell price per material, used when a Sellwand empties a chest.
# Add / edit materials here to match your server economy (e.g. mirror your ShopGUIPlus prices).
sell-prices:
  COBBLESTONE: 1
  STONE: 1
  COAL: 3
  IRON_INGOT: 8
  GOLD_INGOT: 12
  DIAMOND: 40
  EMERALD: 35
  NETHERITE_SCRAP: 90
  ROTTEN_FLESH: 0.5
  BONE: 1
  STRING: 1
  GUNPOWDER: 2
  REDSTONE: 1
  LAPIS_LAZULI: 2
  RAW_IRON: 6
  RAW_GOLD: 10
  RAW_COPPER: 2
  COPPER_INGOT: 3

# ---------------- Spawner Sellwands ----------------
# On purchase this runs settings.spawnerwand-give-command from console (default
# "ds givewand %player% %multiplier%") - the same command you already use by hand
# to give spawner sellwands, e.g. "ds givewand Steve 1.5x". `uses` is shown on the
# button as info only; it isn't sent in the command since your /ds plugin manages
# uses itself.
spawnerwands:
  tier1: { display: "Spawner Sellwand I",   multiplier: 1.5,  uses: 500,  price: 1200 }
  tier2: { display: "Spawner Sellwand II",  multiplier: 1.75, uses: 750,  price: 2000 }
  tier3: { display: "Spawner Sellwand III", multiplier: 2.0,  uses: 1000, price: 3000 }

# ---------------- Buy Coins (real money top-up) ----------------
# The Buy Coins dialog shows these price tiers as plain info text, plus a
# "Visit Store" button that sends the player a clickable link to settings.store-url
# (above) in chat. price-label/coins are just what's SHOWN on screen - they don't
# charge anything themselves; your store/payment gateway is what actually charges
# the player and should credit coins via `/coin give <player> <amount>`.
buycoins:
  tier1: { price-label: "₹100", coins: 500 }
  tier2: { price-label: "₹200", coins: 1100 }
  tier3: { price-label: "₹300", coins: 1800 }
  tier4: { price-label: "₹400", coins: 2600 }
  tier5: { price-label: "₹500", coins: 3500 }

# ---------------- Orbs (second, separate currency) ----------------
# Every online player automatically receives `amount-per-interval` Orbs every
# `interval-minutes` minutes, with a chat message (see messages.yml -> orbs.received).
orbs:
  interval-minutes: 5
  amount-per-interval: 1
  gui-title: "<light_purple><bold>Orbshop"

# ---------------- Storage ----------------
# How often coins.yml and orbs.yml are written to disk, in seconds.
#
# Balances are kept in memory and written by a background task, so a balance
# change never touches the disk on the server thread. This used to work the
# other way round: every single change rewrote the ENTIRE file, synchronously,
# on the main thread. One orb payout to 42 online players meant 42 full file
# writes in a row - a spark profile taken while TPS was dropping showed 94% of
# everything this plugin did was that one call. It also got slower every month,
# because the cost scaled with how many players had EVER been in the file, not
# how many were online.
#
# The trade: an UNCLEAN stop (OOM kill, panel force-stop, power loss) can lose
# up to this many seconds of balance changes. A normal stop or restart never
# loses anything - the plugin flushes on shutdown. Lower this for a smaller
# window at the cost of a little more disk I/O; values under 5 are treated as 5.
storage:
  balance-save-interval-seconds: 15

# ---------------- Orbshop (spend Orbs on spawners) ----------------
# Opened from the "Orbshop" button on the main /coinshop menu. Each entry's
# `commands` run from console on purchase with %player% replaced by the buyer's
# name - a list because you can run more than one command per item if needed.
#
# Uses your own spawner plugin's give command: "ds give <player> <TYPE>"
# (same plugin as the /ds givewand command used for Spawner Sellwands above).
orbshop:
  allay:
    display: "Allay Spawner"
    price: 150
    commands:
      - "ds give %player% ALLAY"
  enderman:
    display: "Enderman Spawner"
    price: 300
    commands:
      - "ds give %player% ENDERMAN"
  creeper:
    display: "Creeper Spawner"
    price: 450
    commands:
      - "ds give %player% CREEPER"
  turtle:
    display: "Turtle Spawner"
    price: 600
    commands:
      - "ds give %player% TURTLE"
  breeze:
    display: "Breeze Spawner"
    price: 700
    commands:
      - "ds give %player% BREEZE"
  evoker:
    display: "Evoker Spawner"
    price: 1000
    commands:
      - "ds give %player% EVOKER"