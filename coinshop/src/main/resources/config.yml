# ================================================
#   Dreamcoinshop - Coinshop configuration
#   Edit prices / lists here, no code changes needed
# ================================================

# What currency the /coinshop menu spends. This refers to the "Coins" balance
# tracked by CoinsManager (NOT the Vault "$" money).
settings:
  gui-title: "<gold><bold>Coinshop"

  # Master switch for every sound effect in sounds.yml. Set to false to make
  # the whole plugin completely silent without deleting sounds.yml.
  sounds-enabled: true

  # How the chat prefix/tag is placed relative to the player's name.
  # Placeholders: <name> = player's name (with gradient applied if equipped)
  #               <tag>  = the equipped tag component (empty if none equipped)
  # Default puts the tag AFTER the name (right side), e.g. "Steve [VIP]: hello"
  chat-name-format: "<name> <tag>"

  # Console command run when a Spawner Sellwand tier is purchased. %player% is
  # replaced with the buyer's name, %multiplier% with the tier's multiplier
  # written like "1.5x" - matches what you already type by hand, e.g.
  # "ds givewand Steve 1.5x". Edit this if your command is different.
  spawnerwand-give-command: "ds givewand %player% %multiplier%"

  # Titles shown at the top of every /coinshop screen. Edit freely.
  menu-titles:
    main: "<gold><bold>Coinshop"
    chatcolors: "<gold><bold>Chat Colour"
    glows: "<gold><bold>Glow"
    perks: "<gold><bold>Perks"
    tags: "<gold><bold>Tags"
    gradients: "<gold><bold>Name Gradient"
    sellwands: "<gold><bold>Sellwands"
    spawnerwands: "<gold><bold>Spawner Sellwands"
    buycoins: "<gold><bold>Buy Coins"
    topcoins: "<gold><bold>Top Coins"
    orbshop: "<light_purple><bold>Orbshop"

  # Descriptions shown on the main menu category buttons.
  menu-descriptions:
    chatcolors: "Unlock colours & gradients for your chat messages"
    glows: "Unlock a glowing name colour"
    perks: "Unlock handy commands like /craft and /enderchest"
    tags: "Unlock a tag shown next to your name in chat"
    gradients: "Unlock a gradient colour for your name"
    sellwands: "Buy wands that instantly sell a chest's contents"
    spawnerwands: "Buy wands that instantly sell spawners at a bonus rate"
    buycoins: "Top up your Coins balance with real money"
    topcoins: "See who has the most Coins on the server"
    orbshop: "Spend your Orbs on spawners"

  # Store link opened by the "Visit Store" button in the Buy Coins dialog.
  store-url: "https://store.taraashmc.fun"

# ---------------- Chat Colours ----------------
# key: internal id (also used for permission-less unlock tracking)
# display: shown name
# color: MiniMessage color / hex used for the preview + actual chat colour
# price: cost in Coins
chatcolors:
  red:          { display: "Red",           color: "#FF5555", price: 1000 }
  gold:         { display: "Gold",          color: "#FFAA00", price: 1000 }
  yellow:       { display: "Yellow",        color: "#FFFF55", price: 1000 }
  green:        { display: "Green",         color: "#55FF55", price: 1000 }
  aqua:         { display: "Aqua",          color: "#55FFFF", price: 1000 }
  blue:         { display: "Blue",          color: "#5555FF", price: 1000 }
  light_purple: { display: "Pink",          color: "#FF55FF", price: 1000 }
  white:        { display: "White",         color: "#FFFFFF", price: 1000 }
  dark_red:     { display: "Dark Red",      color: "#AA0000", price: 1000 }
  dark_green:   { display: "Dark Green",    color: "#00AA00", price: 1000 }
  dark_aqua:    { display: "Dark Aqua",     color: "#00AAAA", price: 1000 }
  dark_purple:  { display: "Dark Purple",   color: "#AA00AA", price: 1000 }
  # gradient chat colours (whole message is rendered as a gradient)
  sunset_gradient: { display: "Sunset Gradient", gradient: ["#FF512F", "#F09819"], price: 1200 }
  ocean_gradient:  { display: "Ocean Gradient",  gradient: ["#2193b0", "#6dd5ed"], price: 1200 }
  toxic_gradient:  { display: "Toxic Gradient",  gradient: ["#a8ff78", "#78ffd6"], price: 1200 }

# ---------------- Name Glow (Glowing effect colour) ----------------
glows:
  red:          { display: "Red Glow",     color: "#FF5555", price: 1000 }
  gold:         { display: "Gold Glow",    color: "#FFAA00", price: 1000 }
  green:        { display: "Green Glow",   color: "#55FF55", price: 1000 }
  aqua:         { display: "Aqua Glow",    color: "#55FFFF", price: 1000 }
  blue:         { display: "Blue Glow",    color: "#5555FF", price: 1000 }
  purple:       { display: "Purple Glow",  color: "#AA00AA", price: 1000 }
  white:        { display: "White Glow",   color: "#FFFFFF", price: 1000 }
  rainbow:      { display: "Rainbow Glow", rainbow: true,    price: 1500 }

# ---------------- Perks ----------------
# permission: the bukkit permission that gets granted (via PermissionAttachment) while online.
# This plugin only grants/revokes the permission node itself - it doesn't add the /craft,
# /smithingtable, etc. commands. Point each `permission:` at whatever plugin already provides
# that command on your server (e.g. EssentialsX uses "essentials.craft", "essentials.enderchest",
# etc.) so owning the perk actually unlocks the command. Edit freely - order here is menu order.
perks:
  craft:         { display: "/craft",         permission: "dreamcoinshop.perk.craft",         price: 100 }
  smithingtable: { display: "/smithingtable", permission: "dreamcoinshop.perk.smithingtable", price: 100 }
  grindstone:    { display: "/grindstone",    permission: "dreamcoinshop.perk.grindstone",    price: 100 }
  anvil:         { display: "/anvil",         permission: "dreamcoinshop.perk.anvil",         price: 100 }
  enderchest:    { display: "/enderchest",    permission: "dreamcoinshop.perk.enderchest",    price: 100 }
  nick:          { display: "/nick",          permission: "dreamcoinshop.perk.nick",          price: 100 }

