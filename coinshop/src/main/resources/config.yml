# ════════════════════════════════════════════════════════════
#   Dreamcoinshop  ·  config.yml
#   Most of this can also be changed in-game: /coinshop settings
#   After editing this file, run /coinshop reload.
# ════════════════════════════════════════════════════════════

# Manage your license at https://dreamscube.fun
# Filled in automatically on first start if you downloaded Dreamcoinshop from
# BuiltByBit. Paste your key here if it's empty.
license-key: ""

# Used by the plugin to update this file. Don't change it.
config-version: 3

# ─────────────────────────────── currencies ───────────────────────────────
# The names of the two currencies, used in every message, title and button
# (messages.yml: <coins_name>, <orbs_name> ...). Rename Orbs to Shards, Gems,
# Tokens - anything. Saved balances don't change.
currencies:
  coins:
    name: "Coins"             # "500 Coins", "Top Coins"
    # One of them. Empty = the name without its last "s" (Coins -> Coin).
    name-singular: ""
    # Extra command names for /coin (e.g. [gem, gems]). Needs a restart.
    commands: []
  orbs:
    name: "Orbs"
    name-singular: ""
    # Name of its shop on the menus. Empty = automatic: "Orbshop", or "Shard Shop"
    # after renaming Orbs to Shards (name-singular + " Shop").
    shop-name: ""
    # Extra command names for /orb and /orbshop (e.g. [shard, shards] and [shardshop]). Needs a restart.
    commands: []
    shop-commands: []

# ─────────────────────────────── menus ───────────────────────────────
menu:
  # Which menu /coinshop opens:
  #   AUTO   - dialog screens for Java players on Paper 1.21.6+, the chest menu for
  #            everyone else (Spigot, older servers, older clients through ViaVersion)
  #   DIALOG - dialogs whenever the server and client support them
  #   GUI    - always the chest menu
  # /coinshop gui and /coinshop dialog open one or the other directly.
  style: AUTO
  # Menus for Bedrock (Geyser) players: GUI (recommended, works best) or DIALOG.
  bedrock-style: GUI
  # A second click within this time is ignored, so a double click can't buy twice.
  click-cooldown-ms: 400
  # Show "Your balance: ..." at the top of the main menu.
  show-balance: true
  # Titles at the top of every screen.
  titles:
    main: "<gold><bold>Coinshop"
    chatcolors: "<gold><bold>Chat Colour"
    glows: "<gold><bold>Glow"
    perks: "<gold><bold>Perks"
    tags: "<gold><bold>Tags"
    gradients: "<gold><bold>Name Gradient"
    flags: "<gold><bold>Flags"
    particles: "<gold><bold>Particles"
    sellwands: "<gold><bold>Sellwands"
    spawnerwands: "<gold><bold>Spawner Sellwands"
    buycoins: "<gold><bold>Buy <coins_name>"
    topcoins: "<gold><bold>Top <coins_name>"
    orbshop: "<light_purple><bold><orbshop_name>"
    orbstop: "<light_purple><bold><orbs_name> Top"
    settings: "<red><bold>Coinshop Settings"
  # Descriptions of the buttons on the main menu.
  descriptions:
    chatcolors: "Unlock colours & gradients for your chat messages"
    glows: "Unlock a glowing name colour"
    perks: "Unlock handy commands"
    tags: "Unlock a tag shown next to your name in chat"
    gradients: "Unlock a gradient colour for your name"
    flags: "Show your country's flag next to your name in chat"
    particles: "Trails, halos, wings and more around you"
    sellwands: "Buy wands that instantly sell a chest's contents"
    spawnerwands: "Buy wands that instantly sell spawners at a bonus rate"
    buycoins: "Top up your <coins_name> balance with real money"
    topcoins: "See who has the most <coins_name> on the server"
    orbshop: "Spend your <orbs_name> on spawners"
    settings: "Change the shop settings and prices (admins)"

# ─────────────────────────────── chest menu layout ───────────────────────────────
# How the chest menus look (old versions, Bedrock, /coinshop gui). Slots count
# from 0 (top left) to 53 (bottom right of 6 rows), 9 per row. Icons are item
# names like DIAMOND. The section icons are used in dialogs too.
gui:
  # Border item. AIR = no border.
  filler: BLACK_STAINED_GLASS_PANE
  # true = fill every empty slot with it, not only the border.
  fill-empty: false
  # Rows of the main menu (3-6). 0 = as many as needed.
  main-rows: 0
  # Where the info item (balance, sale ...) goes in the top row (0-8).
  info-slot: 4
  # Fixed slots for the main menu buttons. Leave a section out to put it in the
  # next free slot. Example for a 5-row menu:
  #   chatcolors: 10, glows: 11, perks: 12, tags: 13, gradients: 14, flags: 15, particles: 16 ...
  main-slots: {}
  # Icons of the shop sections.
  icons:
    chatcolors: NAME_TAG
    glows: GLOWSTONE_DUST
    perks: NETHER_STAR
    tags: PAPER
    gradients: FIREWORK_STAR
    flags: WHITE_BANNER
    particles: BLAZE_POWDER
    sellwands: BLAZE_ROD
    spawnerwands: SPAWNER
    buycoins: GOLD_INGOT
    topcoins: DIAMOND
    orbshop: ENDER_PEARL
    settings: COMPARATOR
  # Icons of the fixed buttons.
  buttons:
    back: ARROW
    close: BARRIER
    previous: ARROW
    next: SPECTRAL_ARROW

# Turn whole sections of the shop on or off. A section that's off is hidden
# from the menu, and anything already bought in it stops showing.
categories:
  chatcolors: true
  glows: true
  perks: true
  tags: true
  gradients: true
  flags: true
  sellwands: true
  spawnerwands: true
  buycoins: true
  topcoins: true
  orbshop: true
  particles: true

# ─────────────────────────────── buying ───────────────────────────────
shop:
  # Equip a colour / glow / tag / gradient / flag right after buying it.
  # false = buy first, then click it again to equip.
  equip-on-purchase: true
  # Write every purchase to the console log.
  log-purchases: true

# ─────────────────────────────── chat ───────────────────────────────
chat:
  # Format chat with the player's name gradient, tag, flag and chat colour.
  # Turn this off if another chat plugin formats chat; it can still show them
  # with %dreamcoinshop_tag%, %dreamcoinshop_flag% and %dreamcoinshop_gradient_name%.
  enabled: true
  # <name>    the player's name (with their gradient)
  # <tag>     their tag, with a space in front (empty if none)
  # <flag>    their flag, with a space in front (empty if none)
  # <message> the message (in their chat colour)
  format: "<name><tag><flag><gray>: </gray><message>"
  show-tags: true
  show-flags: true
  # Colour messages with the player's chat colour.
  chat-colors: true
  # Event priority of the chat formatting. MONITOR runs last, so it wins over
  # other plugins that also change the chat format.
  priority: MONITOR

# Name gradients are shown in chat (above) and in these places:
names:
  # The tab list name.
  tab-list: true
  # The "display name" other plugins use (e.g. join messages, /msg).
  display-name: true

# ─────────────────────────────── flags ───────────────────────────────
# Country flags, shown next to the player's tag in chat.
# Java 1.21.9+ players see the real flag picture; older clients and plain Spigot
# show the country code instead, e.g. [IN].
flags:
  # Price of each flag, in Coins.
  price: 1000
  # Which flags are for sale: ALL, or a list of country codes like [IN, US, GB].
  sold: ALL
  # Shown first in the list (the rest follow A-Z).
  featured: [IN, US, GB, PK, BD, NP, AE, CA, AU, DE, FR, BR]
  # The flag on the main menu's "Flags" button keeps changing to a different country.
  rotate:
    enabled: true
    seconds: 2
    # Stop changing it after this long without a click (0 = only change when the menu opens).
    max-seconds: 60
  # How the flag looks for players who can't see the picture (and on Spigot).
  text-format: "<gray>[<white><code></white>]</gray>"
  # Bedrock (Geyser) players:
  #   TEXT  - the country code, e.g. [IN]
  #   GLYPH - a flag picture from a resource pack (see country-flags-bedrock.properties;
  #           the TaraashMC-Flags.mcpack from Dreamtab works)
  #   HIDE  - nothing
  bedrock: TEXT
  # Flags shown per page in the list.
  per-page: 24

# ─────────────────────────────── particles ───────────────────────────────
# How particle cosmetics (the "particles:" items further down) are shown.
particle-settings:
  # Other players see your particles too. false = only you see your own.
  visible-to-others: true
  # Draw every ... ticks (20 = 1 second). Higher = lighter on the server and clients.
  interval-ticks: 2
  # Keep showing particles while the player has invisibility.
  when-invisible: false

# ─────────────────────────────── store ───────────────────────────────
# Link of the "Visit Store" button in the Buy Coins menu.
store-url: "https://store.taraashmc.fun"

# Console command run when a Spawner Sellwand is bought. %player% = buyer's name,
# %multiplier% = the tier's multiplier written like "1.5x".
spawnerwand-give-command: "ds givewand %player% %multiplier%"

# ─────────────────────────────── orbs ───────────────────────────────
# A second currency every online player earns over time.
orbs:
  payout:
    enabled: true
    interval-minutes: 5
    amount: 1
    # Tell the player in chat (messages.yml -> orbs.received).
    message: true

# ─────────────────────────────── sale ───────────────────────────────
# Put the shop on sale: /coinshop sale <percent> <time> [sections...]
#   /coinshop sale 20 2h          everything 20% off for 2 hours
#   /coinshop sale 50 1d tags     tags half price for a day
#   /coinshop sale stop           end it now        /coinshop sale   see the current one
# Or in-game: /coinshop settings -> Sale. A sale is saved in the database, so every
# server of a network has it (they notice a new one within 10 seconds).
sale:
  # Announce a new sale in chat (messages.yml -> sale.started).
  broadcast: true
  # Show the old price crossed out next to the sale price.
  show-old-price: true

# ─────────────────────────────── pay ───────────────────────────────
# /coin pay <player> <amount> (and /orb pay): players send each other money.
# Works for offline players and players on other servers too.
pay:
  coins:
    enabled: true
    # Smallest amount that can be sent.
    min: 1
    # Part of every payment that disappears (0 = none). 5 = the receiver gets 95%.
    tax-percent: 0
    # Seconds between two payments of the same player.
    cooldown-seconds: 3
  orbs:
    enabled: false
    min: 1
    tax-percent: 0
    cooldown-seconds: 3

# ─────────────────────────────── leaderboards ───────────────────────────────
top:
  # Players shown in Top Coins / Orbs Top (each with their head and equipped flag).
  size: 10
  # Players shown after clicking "View full leaderboard" (up to 100).
  full-size: 50
  # How often the list is reloaded from the database.
  refresh-seconds: 30
  # PlaceholderAPI, for holograms (DecentHolograms, FancyHolograms ...):
  #   %dreamcoinshop_top_coins_1_name%  %dreamcoinshop_top_coins_1_amount_formatted%
  #   %dreamcoinshop_top_orbs_3_flag%   (1 ... full-size; also amount, flag_code, flag_name, uuid)
  #   %dreamcoinshop_rank_coins%        the player's own place
  # Shown for an empty place (#8 when only 7 players have coins) and an unranked player.
  placeholder-none: "---"

# ─────────────────────────────── storage ───────────────────────────────
# Where balances and unlocks are saved.
#   SQLITE      - a file in this folder (data.db). For one server. Nothing to set up.
#   MYSQL / MARIADB / POSTGRESQL / REDIS
#               - a database server. Every server that uses the same database and
#                 table-prefix shares the same Coins, Orbs and unlocks (BungeeCord /
#                 Velocity networks), and changes show up on the others right away.
# The old coins.yml / orbs.yml / playerdata files are imported automatically once.
storage:
  type: SQLITE
  host: "localhost"
  port: 3306                # MySQL/MariaDB 3306, PostgreSQL 5432, Redis 6379
  database: "minecraft"     # MySQL / MariaDB / PostgreSQL
  username: "root"          # MySQL / MariaDB / PostgreSQL
  password: ""
  ssl: false
  table-prefix: "dcs_"      # letters, digits and _ only (Redis: also :)
  redis-username: ""        # Redis 6+ ACL user; leave empty for password only
  redis-database: 0         # Redis database number (0-15)
  # Name of this server in the logs.
  server-name: "survival"
  # SQL: how often to check for changes made on the other servers (milliseconds).
  sync-poll-ms: 1000

# ════════════════════════════════════════════════════════════
#   Shop items. Keys are ids (saved for each player who buys them) - don't
#   rename them once players own them. price is in Coins.
#   icon: optional item shown in the menus (any material name).
# ════════════════════════════════════════════════════════════

