  vip:     { display: "[VIP]",     text: "<bold><gradient:#ffd700:#ff8c00>VIP</gradient></bold>",     price: 1000 }
  queen:   { display: "[QUEEN]",   text: "<bold><gradient:#ff1493:#ff69b4>QUEEN</gradient></bold>",    price: 1000 }
  pro:     { display: "[PRO]",     text: "<bold><gradient:#00c6ff:#0072ff>PRO</gradient></bold>",       price: 1000 }
  legend:  { display: "[LEGEND]",  text: "<bold><gradient:#f7971e:#ff5f6d>LEGEND</gradient></bold>",   price: 1000 }
  god:     { display: "[GOD]",     text: "<bold><gradient:#ffd700:#ff9d00>GOD</gradient></bold>",      price: 1000 }
  king:    { display: "[KING]",    text: "<bold><gradient:#ffd700:#ff4500>KING</gradient></bold>",     price: 1000 }
  angel:   { display: "[ANGEL]",   text: "<bold><gradient:#ffb6c1:#ffd9e6>ANGEL</gradient></bold>",    price: 1000 }
  boss:    { display: "[BOSS]",    text: "<bold><gradient:#ff0000:#8b0000>BOSS</gradient></bold>",     price: 1000 }
