  enderchest:    { display: "/enderchest",    permission: "dreamcoinshop.perk.enderchest",    price: 100, icon: ENDER_EYE }
  nick:          { display: "/nick",          permission: "dreamcoinshop.perk.nick",          price: 100, icon: NAME_TAG }

