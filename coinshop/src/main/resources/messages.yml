#
#    DreamCoinshop 2.0  ·  messages.yml
#
#    Every chat message and menu text. Formatting is MiniMessage: <red>, <bold>,
#    <#FF9933>, <gradient:#FF0000:#0000FF> ...  (https://docs.advntr.dev/minimessage)
#    • Placeholders look like <player>; the ones a line has are listed above it.
#    • Leave a chat message empty ("") to not send it at all.
#    • New lines are added to this file by themselves after an update.
#    • The currency names from config.yml (currencies:) work in every line:
#        <coins_name> Coins   <coins_lower> coins   <coin_name> Coin
#        <orbs_name> Shards   <orbs_lower> shards   <orb_name> Shard   <orbshop_name> Shard Shop
#    • <cmd> in a usage line is the command that was typed (coin, orb, shard ...).
#    • After editing, run /coinshop reload.
#
# ════════════════════════════════════════════════════════════════════════════════

# Used by the plugin to update this file. Don't change it.
messages-version: 2

general:
  player-only: "<shadow:black><red>Only players can do that.</red></shadow>"
  not-online: "<shadow:black><red>That player is not online.</red></shadow>"
  # <player>
  unknown-player: "<shadow:black><red>No player called <white><player></white> has played here.</red></shadow>"
  no-permission: "<shadow:black><red>You don't have permission to do that.</red></shadow>"
  invalid-amount: "<shadow:black><red>That's not a valid amount.</red></shadow>"
  amount-must-be-positive: "<shadow:black><red>Amount must be positive.</red></shadow>"
  reloaded: "<shadow:black><green>Dreamcoinshop reloaded (config.yml, messages.yml, sounds.yml).</green></shadow>"
  reload-broken: "<shadow:black><red>config.yml has a mistake (see the console) - nothing was reloaded, the old settings stay in use.</red></shadow>"
  reload-storage: "<shadow:black><yellow>The storage settings changed - restart the server to use the new database.</yellow></shadow>"
  database-down: "<shadow:black><red>The shop is closed: the database can't be reached. Tell an admin.</red></shadow>"
  import-confirm: "<shadow:black><yellow>This imports this server's old coins.yml / orbs.yml / playerdata into the database, replacing the balances and unlocks of the players in them. Type <white>/coinshop import confirm</white> to do it.</yellow></shadow>"
