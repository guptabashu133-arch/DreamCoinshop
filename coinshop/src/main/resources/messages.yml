# ================================================
#   Dreamcoinshop - messages.yml
#   Every message and menu text. MiniMessage formatting (<red>, <gradient:...>,
#   <bold>, <#FF9933> ...). Placeholders look like <player> and are listed above
#   each line. Leave a chat message empty ("") to not send it at all.
#   New keys are added to this file automatically after an update.
# ================================================

general:
  player-only: "<shadow:black><red>Only players can do that.</red></shadow>"
  not-online: "<shadow:black><red>That player is not online.</red></shadow>"
  # <player>
  unknown-player: "<shadow:black><red>No player called <white><player></white> has played here.</red></shadow>"
  no-permission: "<shadow:black><red>You don't have permission to do that.</red></shadow>"
  invalid-amount: "<shadow:black><red>That's not a valid amount.</red></shadow>"
  amount-must-be-positive: "<shadow:black><red>Amount must be positive.</red></shadow>"
  reloaded: "<shadow:black><green>Dreamcoinshop reloaded (config.yml, messages.yml, sounds.yml).</green></shadow>"
  reload-broken: "<shadow:black><red>config.yml has a mistake (see the console) - nothing was reloaded, the old settings stay in use.</red></shadow>"
  reload-storage: "<shadow:black><yellow>The storage settings changed - restart the server to use the new database.</yellow></shadow>"
  database-down: "<shadow:black><red>The shop is closed: the database can't be reached. Tell an admin.</red></shadow>"
  import-confirm: "<shadow:black><yellow>This imports this server's old coins.yml / orbs.yml / playerdata into the database, replacing the balances and unlocks of the players in them. Type <white>/coinshop import confirm</white> to do it.</yellow></shadow>"
  # <count>
  import-done: "<shadow:black><green>Imported <white><count></white> players from the old yml files.</green></shadow>"
  import-none: "<shadow:black><gray>There are no old coins.yml / orbs.yml / playerdata files in this server's folder.</gray></shadow>"
  no-dialogs: "<shadow:black><yellow>Dialog menus need Paper 1.21.6+ and a 1.21.6+ client - opening the chest menu.</yellow></shadow>"

# /coin ...
coin:
  # <player>, <balance>
  balance-self: "<shadow:black><white>Your balance: <gold><bold><balance> coins</bold></gold></white></shadow>"
  balance-other: "<shadow:black><white><aqua><player></aqua>'s balance: <gold><bold><balance> coins</bold></gold></white></shadow>"
  usage-balance-console: "<shadow:black><red>Console must specify a player: <gray>/coin balance <player></gray></red></shadow>"
  usage-give: "<shadow:black><red>Usage: <gray>/coin give <player> <amount></gray></red></shadow>"
  usage-giveall: "<shadow:black><red>Usage: <gray>/coin giveall <amount></gray></red></shadow>"
  usage-remove: "<shadow:black><red>Usage: <gray>/coin remove <player> <amount></gray></red></shadow>"
  usage-set: "<shadow:black><red>Usage: <gray>/coin set <player> <amount></gray></red></shadow>"
  # <player>, <amount>
  gave: "<shadow:black><green>Gave <gold><bold><amount> coins</bold></gold> to <aqua><player></aqua></green></shadow>"
  received: "<shadow:black><white><gold><bold><amount> coins</bold></gold> has been added to your account!</white></shadow>"
  gave-all: "<shadow:black><green>Gave <gold><bold><amount> coins</bold></gold> to every online player.</green></shadow>"
  received-all: "<shadow:black><white>Added <gold><bold><amount> coins</bold></gold> to All Online players.</white></shadow>"
  removed: "<shadow:black><green>Removed <gold><bold><amount> coins</bold></gold> from <aqua><player></aqua></green></shadow>"
  set: "<shadow:black><green>Set <aqua><player></aqua>'s balance to <gold><bold><amount> coins</bold></gold></green></shadow>"
  help-header: "<shadow:black><gold><bold>--- Coins Help ---</bold></gold></shadow>"

# /coinshop menus
shop:
  not-enough-coins: "<shadow:black><red>You don't have enough coins for that.</red></shadow>"
  # <item>
  unlocked: "<shadow:black><green>Unlocked <yellow><bold><item></bold></yellow>! Click it again to equip it.</green></shadow>"
  unlocked-equipped: "<shadow:black><green>Bought and equipped <yellow><bold><item></bold></yellow>!</green></shadow>"
  unlocked-perk: "<shadow:black><green>Unlocked <yellow><bold><item></bold></yellow>!</green></shadow>"
  equipped: "<shadow:black><green>Equipped <yellow><bold><item></bold></yellow>!</green></shadow>"
  unequipped: "<shadow:black><yellow>Unequipped <white><item></white>.</yellow></shadow>"
  already-unlocked: "<shadow:black><gray>Already unlocked</gray></shadow>"
  purchased-wand: "<shadow:black><green>Purchased <yellow><bold><item></bold></yellow>!</green></shadow>"
  # <item>
  give-failed: "<shadow:black><red>Couldn't give your <item> (the server command didn't run) - you got your money back.</red></shadow>"
  give-partly: "<shadow:black><red>Only part of your <item> could be given (a server command failed). Please tell staff - it was logged.</red></shadow>"
  inventory-full: "<shadow:black><yellow>Your inventory was full - the rest was dropped at your feet.</yellow></shadow>"
  loading: "<shadow:black><yellow>Your shop data is still loading, try again in a moment.</yellow></shadow>"
  section-off: "<shadow:black><red>That part of the shop is turned off.</red></shadow>"
  balance-line: "<shadow:black><gray>Your balance: <gold><bold><balance> coins</bold></gold></gray></shadow>"

# sellwand + spawner sellwand
sellwand:
  no-uses: "<shadow:black><red>This sellwand is out of uses!</red></shadow>"
  nothing-sellable: "<shadow:black><yellow>Nothing sellable was found in that chest.</yellow></shadow>"
  # <amount>
  sold: "<shadow:black><green>Sold chest contents for <gold><bold><amount> coins</bold></gold>!</green></shadow>"
  broke: "<shadow:black><red>Your sellwand broke!</red></shadow>"
  # The wand item. <name>, <multiplier>, <uses>
  item-name: "<gold><name>"
  item-lore: "<green>Multiplier: <multiplier>x\n<aqua>Uses left: <uses>\n<gray>Right click a chest to sell its contents!"

# Buy Coins menu
buycoins:
  # <price>, <coins> - one line per tier
  tier-line: "<shadow:black><gray><price> <dark_gray>→</dark_gray> <gold><bold><coins> coins 🪙</bold></gold></gray></shadow>"
  # <url>
  visit-store: "<shadow:black><gold>Click here to visit the store and buy coins 🪙: <aqua><underlined><url></underlined></aqua></gold></shadow>"
  no-url-configured: "<shadow:black><red>No store link has been configured yet - ask an admin to set store-url in config.yml.</red></shadow>"

# Orbs (second currency)
orbs:
  # <amount>
  received: "<shadow:black><white>You received <light_purple><bold><amount> orbs</bold></light_purple> playing this server!</white></shadow>"
  balance-self: "<shadow:black><gray>Your Orbs balance: <light_purple><bold><balance> orbs</bold></light_purple></gray></shadow>"
  balance-other: "<shadow:black><gray><aqua><player></aqua>'s Orbs balance: <light_purple><bold><balance> orbs</bold></light_purple></gray></shadow>"
  not-enough-orbs: "<shadow:black><red>You don't have enough orbs for that.</red></shadow>"
  # <item>, <price>
  purchased: "<shadow:black><green>Purchased <yellow><bold><item></bold></yellow> for <light_purple><bold><price> orbs</bold></light_purple>!</green></shadow>"

# /orb ... (mirrors /coin)
orbcmd:
  usage-balance-console: "<shadow:black><red>Console must specify a player: <gray>/orb balance <player></gray></red></shadow>"
  usage-give: "<shadow:black><red>Usage: <gray>/orb give <player> <amount></gray></red></shadow>"
  usage-giveall: "<shadow:black><red>Usage: <gray>/orb giveall <amount></gray></red></shadow>"
  usage-remove: "<shadow:black><red>Usage: <gray>/orb remove <player> <amount></gray></red></shadow>"
  usage-set: "<shadow:black><red>Usage: <gray>/orb set <player> <amount></gray></red></shadow>"
  gave: "<shadow:black><green>Gave <light_purple><bold><amount> orbs</bold></light_purple> to <aqua><player></aqua></green></shadow>"
  received: "<shadow:black><white><light_purple><bold><amount> orbs</bold></light_purple> has been added to your account!</white></shadow>"
  gave-all: "<shadow:black><green>Gave <light_purple><bold><amount> orbs</bold></light_purple> to every online player.</green></shadow>"
  received-all: "<shadow:black><white>Added <light_purple><bold><amount> orbs</bold></light_purple> to All Online players.</white></shadow>"
  removed: "<shadow:black><green>Removed <light_purple><bold><amount> orbs</bold></light_purple> from <aqua><player></aqua></green></shadow>"
  set: "<shadow:black><green>Set <aqua><player></aqua>'s Orbs balance to <light_purple><bold><amount> orbs</bold></light_purple></green></shadow>"
  help-header: "<shadow:black><light_purple><bold>--- Orbs Help ---</bold></light_purple></shadow>"

# Settings menu (/coinshop settings)
settings:
  saved: "<shadow:black><green>Settings saved.</green></shadow>"
  # <setting>
  bad-number: "<shadow:black><red><setting>: that's not a number - kept the old value.</red></shadow>"
  config-broken: "<shadow:black><red>config.yml has a mistake (see the console), so nothing was saved. Fix the file first.</red></shadow>"
  only-dialog: "<shadow:black><yellow>Change this one with /coinshop dialog or in config.yml.</yellow></shadow>"

# ------------------------------------------------------------------
# Menu texts (dialogs and chest menus)
# ------------------------------------------------------------------
menu:
  # <coins>, <orbs>
  balance: "<gray>Your balance: <gold><bold><coins> coins</bold></gold> <dark_gray>|</dark_gray> <light_purple><bold><orbs> orbs</bold></light_purple>"
  # <orbs>
  orbs-balance: "<gray>Your Orbs: <light_purple><bold><orbs> orbs</bold></light_purple>"
  loading: "<yellow>Loading your data..."
  empty: "<gray>Nothing here yet."
  # <page>, <pages>
  page: "<gray>Page <white><page></white> of <white><pages></white>"
  # <query>, <count>
  search-results: "<gray>Search: <white><query></white> <dark_gray>(<count> found)</dark_gray>"
  search-label: "Search a country"
  info: "<gold><bold>Info"

  # Main menu buttons
  button:
    chatcolors: "<yellow>Chat Colour"
    glows: "<yellow>Glow"
    perks: "<yellow>Perks"
    tags: "<yellow>Tags"
    gradients: "<yellow>Name Gradient"
    flags: "<yellow>Flags"
    sellwands: "<yellow>Sellwands"
    spawnerwands: "<yellow>Spawner Sellwands"
    buycoins: "<yellow>Buy Coins"
    topcoins: "<yellow>Top Coins"
    orbshop: "<yellow>Orbshop"
    settings: "<red>Settings"
    back: "<red><< Back"
    close: "<red>Close"
    next: "<yellow>Next >>"
    previous: "<yellow><< Previous"
    search: "<aqua>Search"
    clear-search: "<gray>Show all"
    visit-store: "<green>Visit Store 🪙"
    orbs-top: "<aqua>Orbs Top"
    save: "<green><bold>Save"
    prices: "<gold>Prices"
    # <size>
    full-top: "<yellow>View full leaderboard"
    short-top: "<yellow>Top <size>"
  tooltip:
    back: "<gray>Return to the previous menu"
    buy: "<yellow>Click to purchase"
    equip: "<gray>Click to equip"
    unequip: "<gray>Click to turn off and go back to default"
    owned: "<gray>Already unlocked"
    store: "<gray>Get a clickable store link in chat"
    orbs-top: "<gray>See who has the most Orbs on the server"
    sellwand: "<gray>Right click a chest with this wand to sell its contents"
    spawnerwand: "<gray>Sells spawners at a bonus rate"
    page: "<gray>Go to another page"
    search: "<gray>Type a country above, then click Search"
    # <size>
    full-top: "<gray>See the top <size> players"
    short-top: "<gray>Back to the top <size>"

  # Shown after an item's name. <price>
  status:
    price: "<gray>[<gold><price> coins</gold>]"
    price-orbs: "<gray>[<light_purple><price> orbs</light_purple>]"
    owned: "<aqua>[Owned - click to equip]"
    active: "<green>[ACTIVE - click to disable]"
    perk-owned: "<green>- OWNED"
  # <multiplier>, <uses>
  wand: "<gray>(<multiplier>x | <uses> uses)"
  spawnerwand: "<gray>(<multiplier>x)"
  # Tag preview: <player>, <tag>
  tag-preview: "<white><player> <tag>"
  # A flag in the list (the flag picture is put in front). <country>, <code>
  flag-label: "<white><country>"

  # Top lists. <rank> (coloured #1, #2...), <player> (aqua for yourself), <amount>
  top-line: "<rank> <player> <dark_gray>-</dark_gray> <green><amount> coins"
  top-line-orbs: "<rank> <player> <dark_gray>-</dark_gray> <light_purple><amount> orbs"
  # <amount>
  top-you: "<aqua>You: <green><amount> coins"
  top-you-orbs: "<aqua>You: <light_purple><amount> orbs"
  top-empty: "<gray>Nobody has any coins yet!"
  top-empty-orbs: "<gray>Nobody has any orbs yet!"
  top-loading: "<gray>Loading..."
  # One player in a top list: their head and flag are put in front. <rank>, <player>
  top-entry: "<rank> <player>"
  top-entry-coins: "<green><amount> coins"
  top-entry-orbs: "<light_purple><amount> orbs"
  # Hover text / item lore. <country> (or none)
  top-entry-flag: "<gray>Flag: <white><country>"
  top-entry-no-flag: "<gray>No flag yet"
  # <size>
  top-full-intro: "<gray>The top <size> players"
  # <rank>, <amount>
  top-you-rank-coins: "<aqua>You are <rank>: <green><amount> coins"
  top-you-rank-orbs: "<aqua>You are <rank>: <light_purple><amount> orbs"
  # Under the main menu: the flags coming up next on the Flags button (Java 1.21.9+)
  flags-next: "<gray>Next flags:"

  # Settings menu
  settings-intro: "<gray>Changes are saved to config.yml and work right away."
  settings-toggles: "<gold><bold>Switches"
  settings-values: "<gold><bold>Values"
  # <state>
  setting-on: "<green>ON"
  setting-off: "<red>OFF"
  # Chest menu lore of a switch: <state>
  toggle-lore: "<gray>Now: <state>\n<yellow>Click to switch"
  # Chest menu lore of a value: <value>, <step>
  value-lore: "<gray>Now: <white><value></white>\n<yellow>Left click +<step>, right click -<step>\n<yellow>Shift: x10"
  choice-lore: "<gray>Now: <white><value></white>\n<yellow>Click to change"
  text-lore: "<gray>Now: <white><value></white>\n<yellow>Change it in the dialog menu or config.yml"
  prices-intro: "<gray>Type a new price and press Save. Prices are in coins (Orbshop: orbs)."
  # <price>
  price-lore: "<gray>Price: <gold><price></gold>\n<yellow>Left click +<step>, right click -<step>\n<yellow>Shift: x10"
  prices-pick: "<gray>Pick what to change the prices of."

  # Names of the settings
  setting:
    cat-chatcolors: "Chat Colour section"
    cat-glows: "Glow section"
    cat-perks: "Perks section"
    cat-tags: "Tags section"
    cat-gradients: "Name Gradient section"
    cat-flags: "Flags section"
    cat-sellwands: "Sellwands section"
    cat-spawnerwands: "Spawner Sellwands section"
    cat-buycoins: "Buy Coins section"
    cat-topcoins: "Top Coins section"
    cat-orbshop: "Orbshop section"
    equip-on-purchase: "Equip right after buying"
    log-purchases: "Log purchases in the console"
    show-balance: "Show balance in the main menu"
    sounds: "Sounds"
    chat: "Format chat"
    chat-tags: "Tags in chat"
    chat-flags: "Flags in chat"
    chat-colors: "Chat colours"
    names-tab: "Name gradient in the tab list"
    names-display: "Name gradient as display name"
    flags-rotate: "Changing flag on the menu"
    orbs-payout: "Give Orbs over time"
    orbs-message: "Orbs message"
    flag-price: "Flag price (coins)"
    orb-interval: "Orbs every ... minutes"
    orb-amount: "Orbs each time"
    rotate-seconds: "Flag changes every ... seconds"
    top-size: "Players in Top lists"
    top-full-size: "Players in the full leaderboard"
    click-cooldown: "Click cooldown (ms)"
    menu-style: "Menu style"
    bedrock-style: "Bedrock menu style"
    flags-bedrock: "Flags for Bedrock"
    store-url: "Store link"
